# Notification only: apply dependency changes in the private monorepo.
# This public repository is regenerated by the release exporter; do not merge
# bot changes here, because the next export would overwrite them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    labels: [dependencies, security]
  - package-ecosystem: npm
    directory: /n8n-nodes-freesdn
    # LTS major migrations require explicit qualification; patches still update.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    labels: [dependencies, security]
