# ─────────────────────────────────────────────────────────────────────
# FreeSDN Plugin Manifest - Hello World
# ─────────────────────────────────────────────────────────────────────
#
# This is the required manifest file for every FreeSDN plugin.
# It declares metadata, permissions, dependencies, and settings.
#
# Install:  POST /api/v1/plugins/install  (upload ZIP of this folder)
# ─────────────────────────────────────────────────────────────────────

id: hello-world
name: Hello World
version: 1.2.1
description: >
  A minimal example plugin that demonstrates the FreeSDN Plugin SDK.
  Lists offline devices, creates alerts, emits events, stores settings,
  and exposes a custom REST endpoint.
author: FreeSDN Team
license: MIT
homepage: https://github.com/freesdn/freesdn
# The oldest core this plugin is actually known to run on. It said 1.0.0, which
# claims compatibility with every FreeSDN ever released, including versions
# predating the plugin SDK it imports. The loader trusts this value, so an
# over-broad floor turns a clean "needs a newer FreeSDN" refusal into an import
# error at enable time.
min_core_version: 26.06.1

# Python entry point - file and class that FreeSDN will load
entry_point: plugin.py
class_name: HelloWorldPlugin

# Permissions this plugin needs (must declare upfront)
permissions:
  - code: devices.read
    name: Read Devices
    description: List and inspect network devices
  - code: alerts.read
    name: Read Alerts
    description: View existing alerts
  - code: alerts.write
    name: Write Alerts
    description: Create and resolve alerts
  - code: sites.read
    name: Read Sites
    description: Resolve a device's site_id to a site name for alert text

# Note on `name` and `description`: they are yours to write, and the install
# consent dialog deliberately does NOT show them. It renders FreeSDN's own
# summary for each `code` instead, because an author-supplied label on a
# capability is not something an operator can safely base a trust decision on.
# The `code` is the only part that grants anything.

# Events this plugin subscribes to (wildcards ok, bare * not allowed)
#
# These must be names the platform actually publishes. `alert.created` sat here
# and never fired once: the alert lifecycle publishes `alert.fired`. Nothing
# reports a subscription that can never match, so the plugin installs, enables,
# and stays quiet. Check a name against a running instance before adding it.
event_subscriptions:
  - device.status.*
  - alert.fired

# REST API prefix for this plugin's endpoints
api_prefix: /hello-world

# Navigation item shown in the FreeSDN sidebar
nav_items:
  - path: /hello-world
    label: Hello World
    icon: Sparkles
    order: 90

# Plugin settings schema (shown in plugin config UI)
settings_schema:
  type: object
  properties:
    check_interval_minutes:
      type: integer
      default: 60
      description: How often to scan for offline devices (minutes)
    alert_severity:
      type: string
      enum: [info, warning, error, critical]
      default: warning
      description: Severity level for generated alerts

# External PyPI dependencies (installed in isolated venv)
python_dependencies: []

# Registry metadata. Ignored by the plugin loader (PluginManifest drops
# unknown keys); read by the registry build to fill the catalogue entry.
category: utility
tags:
  - example
  - sdk
  - starter
